<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pharmony — Panel EPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--bd:#052060;--bdk:#0a3a8c;--bm:#0d47c9;--w:#fff;--g100:#f1f5f9;--g400:#94a3b8;--g800:#1e293b;--bp:#dbeafe;--bs:#93c5fd;}
        body{background:var(--g100);font-family:'DM Sans',sans-serif;color:var(--g800);min-height:100vh;}
        .header{background:linear-gradient(135deg,var(--bdk) 0%,var(--bm) 100%);color:var(--w);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;}
        .logo-name{font-family:'Quicksand',sans-serif;font-size:20px;letter-spacing:2px;}
        .btn-logout{background:rgba(255,255,255,0.12);color:var(--w);border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:8px 16px;font-size:13.5px;text-decoration:none;}
        .container{max-width:800px;margin:60px auto;padding:0 24px;text-align:center;}
        h1{font-family:'Quicksand',sans-serif;font-size:26px;font-weight:600;color:var(--bd);margin-bottom:36px;}
        .opciones{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;}
        .opcion{background:var(--w);border:2px solid var(--bp);border-radius:18px;padding:32px;width:280px;text-decoration:none;color:var(--bd);display:block;}
        .opcion:hover{border-color:var(--bs);background:var(--bp);}
        .opcion h2{font-family:'Quicksand',sans-serif;font-size:19px;margin-bottom:8px;}
        .opcion p{color:var(--g400);font-size:14px;}
    </style>
</head>
<body>
    <div class="header"><span class="logo-name">PHARMONY</span><a class="btn-logout" href="{% url 'logout' %}">Cerrar sesión</a></div>
    <div class="container">
        <h1>¿Qué vas a gestionar hoy?</h1>
        <div class="opciones">
            <a class="opcion" href="{% url 'dashboard_eps' %}">
                <h2>Gestor de medicamentos e inventariado</h2>
                <p>Inventario, medicamentos y datos de la EPS.</p>
            </a>
            <a class="opcion" href="{% url 'turnos:marcar_tarjeta' %}">
                <h2>Auxiliar de dispensación y turnos</h2>
                <p>Marcar tarjeta, abrir caja y atender la cola de turnos.</p>
            </a>
        </div>
    </div>
</body>
</html>
