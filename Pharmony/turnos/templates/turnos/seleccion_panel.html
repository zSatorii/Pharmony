{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmony — Panel EPS</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--g100);font-family:'DM Sans',sans-serif;color:var(--g800);min-height:100vh;-webkit-font-smoothing:antialiased;}
        .header{background:linear-gradient(135deg,var(--bdk) 0%,var(--bm) 100%);color:var(--w);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(5,32,96,0.15);}
        .logo-name{font-family:'Quicksand',sans-serif;font-size:20px;letter-spacing:2px;font-weight:700;}
        .btn-logout{background:rgba(255,255,255,0.15);color:var(--w);border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:8px 16px;font-size:13px;text-decoration:none;font-weight:600;transition:background 0.2s;}
        .btn-logout:hover{background:rgba(255,255,255,0.25);}
        .container{max-width:800px;margin:50px auto;padding:0 20px 60px;text-align:center;}
        h1{font-family:'Quicksand',sans-serif;font-size:26px;font-weight:700;color:var(--bd);margin-bottom:32px;}
        .opciones{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
        .opcion{background:var(--w);border:2px solid var(--bp);border-radius:18px;padding:32px 24px;width:300px;text-decoration:none;color:var(--bd);display:block;transition:all 0.2s ease;box-shadow:0 6px 20px rgba(13,71,201,0.06);}
        .opcion:hover{border-color:var(--bm);transform:translateY(-3px);box-shadow:0 12px 28px rgba(13,71,201,0.12);background:var(--bp);}
        .opcion h2{font-family:'Quicksand',sans-serif;font-size:19px;font-weight:700;margin-bottom:8px;}
        .opcion p{color:var(--g400);font-size:13.5px;line-height:1.45;}

        @media (max-width: 640px) {
            .header{padding:12px 16px;}
            .logo-name{font-size:17px;}
            .container{margin:24px auto;padding:0 14px 40px;}
            h1{font-size:21px;margin-bottom:20px;}
            .opciones{flex-direction:column;gap:14px;align-items:stretch;}
            .opcion{width:100%;padding:22px 18px;border-radius:14px;}
            .opcion h2{font-size:17px;}
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="{% url 'dashboard' %}" style="display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#fff;" title="Ir al Dashboard">
            <img src="{% static 'img/logo.png' %}" alt="Pharmony" style="width:34px;height:34px;border-radius:50%;background:#ffffff;padding:2px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
            <span class="logo-name">PHARMONY</span>
        </a>
        <a class="btn-logout" href="{% url 'logout' %}">Cerrar sesión</a>
    </div>
    <div class="container">
        <h1>¿Qué vas a gestionar hoy?</h1>
        <div class="opciones">
            <a class="opcion" href="{% url 'dashboard_eps' %}">
                <h2>Gestor de medicamentos e inventariado</h2>
                <p>Inventario, medicamentos y datos de la EPS.</p>
            </a>
            <a class="opcion" href="{% url 'turnos:marcar_tarjeta' %}">
                <h2>Auxiliar de dispensación y turnos</h2>
                <p>Marcar tarjeta, abrir caja y atender la cola de turnos.</p>
            </a>
        </div>
    </div>
</body>
</html>
